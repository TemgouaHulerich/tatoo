{% extends "base.html" %}
{% block title %}Administration - JBROW{% endblock %}
{% block content %}
<section class="page-hero compact">
  <div class="container text-center" data-reveal>
    <p class="eyebrow">Administration</p>
    <h1>Connexion</h1>
  </div>
</section>
<section class="section-pad bg-cream">
  <div class="container">
    <form method="post" class="admin-login mx-auto" data-reveal>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="form-label" for="password">Mot de passe</label>
      <input class="form-control form-control-lg" type="password" id="password" name="password" required autofocus>
      <button class="btn btn-gold w-100 mt-3" type="submit">Entrer</button>
    </form>
  </div>
</section>
{% endblock %}
